version: '3.8'

services:
  # EzPie 后端服务
  ezpie-platform:
    image: eclipse-temurin:21-jdk-alpine
    container_name: ezpie-platform-server
    command: java -jar /app/ez-pie.jar
    volumes:
      - ./app:/app
      - ./logs:/app/logs
      - /mnt/partweb/ezpie-upload/uploads:/mnt/partweb/ezpie-upload/uploads
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "8081:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod
      # MySQL 连接（共用 traffic-statistics 的 MySQL）
      - SPRING_DATASOURCE_URL=jdbc:mysql://traffic-mysql:3306/ez_pie_platform?characterEncoding=utf8&useSSL=false&serverTimezone=UTC&rewriteBatchedStatements=true
      - SPRING_DATASOURCE_USERNAME=ezpie_user
      - SPRING_DATASOURCE_PASSWORD=EzPie2025!
      # Redis 连接（共用 traffic-statistics 的 Redis）
      - SPRING_REDIS_HOST=traffic-redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_PASSWORD=TrafficRedis2025!
      # Elasticsearch 连接（共用公共 ES）
      - EASY_ES_ADDRESS=shared-elasticsearch:9200
      - EASY_ES_USERNAME=elastic
      - EASY_ES_PASSWORD=EzPieElastic2025!
      # 文件上传路径
      - FILE_UPLOAD_LOCAL_PATH=/mnt/partweb/ezpie-upload/uploads
    networks:
      - traffic-network
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Elasticsearch 7.14（公共共享实例）
  elasticsearch:
    image: elasticsearch:7.14.2
    container_name: shared-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=EzPieElastic2025!
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.transport.ssl.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./elasticsearch/data:/usr/share/elasticsearch/data
      - ./elasticsearch/logs:/usr/share/elasticsearch/logs
      - /etc/localtime:/etc/localtime:ro
    networks:
      - traffic-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:EzPieElastic2025! http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      timeout: 20s
      retries: 10
      interval: 15s

# 使用 traffic-statistics 已创建的外部网络，共享 MySQL 和 Redis
networks:
  traffic-network:
    external: true
    name: traffic-statistics_traffic-network
