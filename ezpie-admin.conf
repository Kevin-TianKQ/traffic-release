# 后端服务上游
# NGINX 配置在
upstream ezpie_platform {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    server_name admin.ezpie.ai;
    # 前端静态资源（Vue/React打包后的dist目录）
    root /home/adm1/ezpie/web/dist;
    index index.html;

    # 访问日志
    access_log /home/adm1/ezpie/admin/nginx/logs/access.log;
    # 前端路由 - SPA单页应用支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端API代理
    location /api/ {
        proxy_pass http://ezpie_platform;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
   }

   location /home/adm1/ezpie/upload/ {
    alias /home/adm1/ezpie/upload/;
   }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}


server {
    if ($host = admin.ezpie.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen       80;
    server_name admin.ezpie.ai;
    return 404; # managed by Certbot
}
